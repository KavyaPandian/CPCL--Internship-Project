<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CPCL CISF Medical System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f0f0f0;
        }
        .container {
            background-color: white;
            padding: 20px;
            border: 1px solid #ccc;
        }
        .header {
            text-align: center;
            color: blue;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
            font-size: 24px;
            margin-bottom: 20px;
        }
        .transaction-header {
            color: red;
            font-weight: bold;
            margin-bottom: 15px;
        }
        .section-header {
            background-color: #e6f3ff;
            padding: 5px;
            margin-bottom: 10px;
            border: 1px solid #b8d6ff;
            color: red;
        }
        .form-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }
        .form-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
        }
        .form-row label {
            font-weight: bold;
        }
        input, select {
            padding: 5px;
            width: 200px;
        }
        input[readonly] {
            background-color: #f5f5f5;
        }
        .submit-btn {
            padding: 8px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            margin-top: 20px;
        }
        .submit-btn:hover {
            background-color: #45a049;
        }
        .error {
            color: red;
            margin-top: 5px;
        }
    </style>                
</head>

            <div class="form-row">

            <div class="form-row">

            <div class="form-row">

            <script>

                };

        </div>

            CPCLCPCL,MAN,9547,MUKTA MAMATA SINGH,4,Y,8/13/2012,NULL,N,L/CONST,100000`;
    
          
            const parseCSV = (data) => {
                const rows = data.trim().split("\n");
                const headers = rows[0].split(",");
                return rows.slice(1).map(row => {
                    const values = row.split(",");
                    return headers.reduce((acc, header, index) => {
                        acc[header.trim()] = values[index].trim();
                        return acc;
                    }, {});
                });
            };
    
            const officers = parseCSV(csvData);
    
            function fetchOfficerDetails() {
                const prno = document.getElementById("prno").value.trim();
                const officer = officers.find(o => o.PRNO === prno);
    
                if (officer) {
                    document.getElementById("name").value = officer.EMPNAME;
                    document.getElementById("grade").value = officer.GRADE;
                    document.getElementById("designation").value = officer.DESGN;
                    document.getElementById("entrydate").value = officer.DATE_OF_JOINING;
                } else {
                    alert("Officer not found");
                    clearOfficerDetails();
                }
            }
    
            function clearOfficerDetails() {
                document.getElementById("name").value = "";
                document.getElementById("grade").value = "";
                document.getElementById("designation").value = "";
                document.getElementById("entrydate").value = "";
            }
    </script>
